name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack newest aurora-exe zip
        run: |
          # ветка dev: исходники лежат папкой exe/, архив не нужен
          if [ -f exe/app/build.gradle.kts ]; then echo "sources: exe/ folder"; else
          Z=$(ls aurora-exe-v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$Z" ]; then echo "::error::no aurora-exe-v*.zip in repo root"; exit 1; fi
          echo "Archive: $Z"
          rm -rf exe
          unzip -q "$Z" 'exe/*'
          fi
          test -f exe/app/build.gradle.kts || { echo "::error::no exe/app/build.gradle.kts in archive"; exit 1; }
          grep -E 'versionName|applicationId' exe/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Signing key
        run: |
          if [ -f signing/aurora.jks ] && [ -f signing/pass.txt ]; then
            cp signing/aurora.jks exe/app/aurora.jks
            PASS=$(cat signing/pass.txt)
            echo "::add-mask::$PASS"
            echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=aurora" >> "$GITHUB_ENV"
            echo "key from folder signing (permanent)"
          else
            echo "NO KEY: temporary debug signing, update over old app will not work"
          fi

      - name: Build
        working-directory: exe
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # Ошибки сборки — в ветку buildlog, чтобы их можно было прочитать без входа на GitHub
      - name: Push build errors
        if: failure()
        run: |
          mkdir -p /tmp/bl && cd /tmp/bl
          grep -E "^e: |error:|What went wrong" -A3 /tmp/build.log > errors.txt || true
          tail -150 /tmp/build.log > tail.txt
          git init -q -b buildlog
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A && git commit -q -m "build errors ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog

      - uses: actions/upload-artifact@v4
        with:
          name: avrora-exe
          path: exe/app/build/outputs/apk/debug/*.apk
